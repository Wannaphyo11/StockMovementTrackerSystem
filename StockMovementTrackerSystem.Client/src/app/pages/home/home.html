<main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-950 px-6 text-white">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_25%_15%,rgba(99,102,241,.32),transparent_30%),radial-gradient(circle_at_80%_80%,rgba(14,165,233,.2),transparent_30%)]"></div>
  <div class="relative flex flex-col items-center text-center">
    <span class="mb-6 flex h-20 w-20 items-center justify-center rounded-[1.7rem] bg-gradient-to-br from-indigo-500 to-violet-600 shadow-2xl shadow-indigo-500/30"><i class="pi pi-box text-3xl"></i></span>
    <p class="mb-2 text-xs font-bold uppercase tracking-[.28em] text-indigo-300">Efficient Soft</p>
    <h1 class="m-0 text-3xl font-bold tracking-tight sm:text-4xl">Stock Movement Tracker</h1>
    <p class="mt-3 max-w-md text-sm text-slate-400">Preparing your inventory workspace and syncing the latest information.</p>
    <div class="mt-8 flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-5 py-2.5 backdrop-blur-md">
      <p-progress-spinner strokeWidth="7" fill="transparent" animationDuration=".7s" [style]="{ width: '20px', height: '20px' }"></p-progress-spinner>
      <span class="text-xs font-medium text-slate-300">Loading workspace…</span>
    </div>
  </div>
</main>
