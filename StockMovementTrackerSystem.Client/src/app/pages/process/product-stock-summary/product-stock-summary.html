<section
    class="p-6 bg-surface-0 dark:bg-surface-200 rounded-xl border border-surface-200 dark:border-surface-200 shadow-sm space-y-6">
    <p-table #dt1 [value]="productStockSummaryStore$.getAll$()" [paginator]="true" [rows]="20"
        [loading]="productStockSummaryStore$.isLoading()" sortField="movementDate" [sortOrder]="-1"
        styleClass="p-datatable-striped" [showCurrentPageReport]="true"
        [globalFilterFields]="['movementId', 'productId', 'productName', 'currentStock', 'quantity', 'type']"
        [tableStyle]="{ 'min-width': '70rem' }"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[20, 50, 100]" selectionMode="single" dataKey="movementId" [(selection)]="selectedValue">
        <ng-template #header>
            <tr class="whitespace-nowrap">
                <th pSortableColumn="movementId">
                    Movement Id
                    <p-sortIcon field="movementId"></p-sortIcon>
                </th>
                <th pSortableColumn="productName">
                    Product
                    <p-sortIcon field="productName"></p-sortIcon>
                </th>
                <th pSortableColumn="currentStock" class="text-right">
                    Current Stock
                    <p-sortIcon field="currentStock"></p-sortIcon>
                </th>
                <th pSortableColumn="quantity" class="text-right">
                    Quantity
                    <p-sortIcon field="quantity"></p-sortIcon>
                </th>
                <th pSortableColumn="type">
                    Type
                    <p-sortIcon field="type"></p-sortIcon>
                </th>
                <th pSortableColumn="movementDate">
                    Movement Date
                    <p-sortIcon field="movementDate"></p-sortIcon>
                </th>
                <th style="width: 5rem"></th>
            </tr>
        </ng-template>

        <ng-template #body let-productStock let-rowIndex="rowIndex">
            <tr class="whitespace-nowrap" [pSelectableRow]="productStock">
                <td>{{ productStock.movementId }}</td>
                <td>
                    <div class="flex flex-col gap-1">
                        <span>{{ productStock.productName || '-' }}</span>
                    </div>
                </td>
                <td>{{ productStock.currentStock ?? 0 }}
                </td>
                <td [class.text-red-500]="productStock.type === 'OUT'"
                    [class.text-green-500]="productStock.type === 'IN'">{{
                    productStock.quantity ?? 0 }}</td>
                <td>
                    <p-tag [value]="productStock.type" [rounded]="true"
                        [severity]="productStock.type === 'OUT' ? 'danger' : 'success'"></p-tag>
                </td>
                <td>{{ productStock.movementDate | date: 'dd/MMM/yyyy
                    hh:mm a' }}</td>
                <td class="text-right p-0">
                    <p-button label="Audit" icon="pi pi-clock" severity="success" [rounded]="true" size="small"
                        type="button" (onClick)="auditLog(productStock)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7" class="py-8 text-center text-surface-500">No stock movement records found.</td>
            </tr>
        </ng-template>
    </p-table>
</section>
